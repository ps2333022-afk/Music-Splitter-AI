<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Splitter AI</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="container">

    <h1>🎵 Music Splitter AI</h1>

    <p>
        Separate vocals, drums, bass and instruments from any song using AI.
    </p>


    <div class="upload-box">

        <h2>Upload Your Song</h2>

        <p>
            Select an audio file and let AI split it into separate tracks.
        </p>


        <input 
            type="file" 
            id="audioFile" 
            accept="audio/*"
        >


        <p id="fileName"></p>


        <button id="splitBtn">
            Split Audio 🎧
        </button>


        <div class="progress-container">

            <div id="progressBar"></div>

        </div>


        <div id="status">
            Waiting for audio...
        </div>


    </div>


</div>


<script src="script.js"></script>

</body>

</html>
